{{- range $name, $service := .Values.services }}
{{- if ne $name "gatewayservice" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-monitor
  labels:
    app: {{ $name }}
    release: stack
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
---
{{- end }}
{{- end }}